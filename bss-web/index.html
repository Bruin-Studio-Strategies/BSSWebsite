<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The landing page's values, duplicated from src/seo/siteMeta.js. Every
         route rewrites these at runtime (src/seo/RouteMeta.jsx), but crawlers and
         link unfurlers that never run JavaScript — Instagram, iMessage, Discord,
         Slack — only ever see what is in this file. Keep the two in step. -->
    <title>Bruin Studio Strategies | UCLA Entertainment Consulting Club</title>
    <meta
      name="description"
      content="UCLA's first and premier entertainment consulting group. Student consultants deliver market research, growth strategy and data analytics for studios, production companies and creative ventures."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.bruinstudiostrategies.com/" />
    <meta name="theme-color" content="#0A0D3D" />

    <!-- Open Graph. og:url pointed at an asset path and og:image was empty, so a
         link shared to Instagram or Discord unfurled as a bare URL with no card. -->
    <meta property="og:site_name" content="Bruin Studio Strategies" />
    <meta property="og:title" content="Bruin Studio Strategies | UCLA Entertainment Consulting Club" />
    <meta
      property="og:description"
      content="UCLA's first and premier entertainment consulting group. Student consultants deliver market research, growth strategy and data analytics for studios, production companies and creative ventures."
    />
    <meta property="og:url" content="https://www.bruinstudiostrategies.com/" />
    <meta property="og:image" content="https://www.bruinstudiostrategies.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bruin Studio Strategies | UCLA Entertainment Consulting Club" />
    <meta
      name="twitter:description"
      content="UCLA's first and premier entertainment consulting group. Student consultants deliver market research, growth strategy and data analytics for studios, production companies and creative ventures."
    />
    <meta name="twitter:image" content="https://www.bruinstudiostrategies.com/og-image.jpg" />

    <!-- Icons. All generated from logo.svg by scripts/generate-favicons.mjs and
         committed to public/ — re-run it after replacing the logo.

         The whole set used to be one line pointing at /logo.svg, and Google's
         result for the site showed its generic globe placeholder. Two causes.
         Nothing answered /favicon.ico, which the favicon crawler asks for
         regardless of what is declared here, and vercel.json's catch-all rewrite
         answered it with index.html under a 200 — a success, for a file that is
         not an image. And logo.svg is a bad small icon even where SVG favicons
         are honoured: hairline ribbons on transparency, which fade to a grey
         smudge at 16px on a white results card.

         The raw SVG is deliberately not in this list any more. Browsers prefer it
         when offered, and it is the one icon here with no navy tile behind it.
         logo.svg is still the source artwork and still what #boot paints below. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- The loading screen that exists before JavaScript does.
         PageTransition's veil is a React component, so it cannot paint until the
         bundle has downloaded, parsed and mounted — measured at ~800ms on a
         throttled phone profile and seconds on real mobile data. Until then the
         page was the body gradient and nothing else, which is what "the loading
         screen doesn't work" looked like.
         Styles are inline and the mark is /logo.svg (a plain public file, not a
         bundled asset) so this needs no stylesheet and no script to appear.
         main.jsx removes it the moment React commits, by which point the veil is
         already painted underneath. Values match LoadingScreen in
         src/transition/PageTransition.jsx — keep the two in step. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: linear-gradient(#2b2a68, #0a0d3d 1200px);
      }
      #boot img {
        width: 4rem;
        height: 4rem;
        animation: boot-spin 1.4s linear infinite;
      }
      #boot div {
        width: 10rem;
        height: 0.25rem;
        overflow: hidden;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.15);
      }
      #boot span {
        display: block;
        width: 33%;
        height: 100%;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.8);
        animation: boot-slide 1.2s ease-in-out infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(300%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot img,
        #boot span {
          animation: none;
        }
      }
      @media (min-width: 640px) {
        #boot img {
          width: 5rem;
          height: 5rem;
        }
        #boot div {
          width: 12rem;
        }
      }
    </style>

    <!-- Static, not injected: this is exactly the kind of thing a crawler reads
         without executing the app. Only facts the club can stand behind — no
         invented ratings, founding dates or member counts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Bruin Studio Strategies",
        "alternateName": "BSS",
        "url": "https://www.bruinstudiostrategies.com/",
        "logo": "https://www.bruinstudiostrategies.com/logo.svg",
        "description": "UCLA's student-run entertainment-industry consulting club, providing market research, growth strategy, data analytics, brand strategy, competitive analysis and market entry for entertainment clients.",
        "email": "bruinstudiostrategies@gmail.com",
        "areaServed": "Los Angeles, California",
        "parentOrganization": {
          "@type": "CollegeOrUniversity",
          "name": "University of California, Los Angeles"
        },
        "sameAs": [
          "https://www.instagram.com/bruinstudiostrategies/",
          "https://www.linkedin.com/company/bruin-studio-strategies"
        ]
      }
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <img src="/logo.svg" alt="" width="80" height="80" />
      <div><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
